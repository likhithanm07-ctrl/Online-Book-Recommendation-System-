{% extends "base.html" %}
{% set hide_navbar = true %}
{% block title %}Reset Password — BookNest{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-box fade-in">
        <div class="auth-logo">
            <div class="icon">🔒</div>
            <h1>Set New Password</h1>
            <p>Almost done! Choose a strong new password.</p>
        </div>

        <!-- Step indicator -->
        <div class="step-indicator">
            <span class="step done">✓</span>
            <span class="step-line done"></span>
            <span class="step done">✓</span>
            <span class="step-line done"></span>
            <span class="step active">3</span>
        </div>
        <p class="step-label">Step 3 of 3 — Choose your new password</p>

        <form method="POST" action="{{ url_for('auth.reset_password') }}" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="new_password">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="new_password" name="new_password" class="form-control"
                        placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
                    <button type="button" class="toggle-pw" onclick="togglePw('new_password', this)"
                        title="Show/hide password">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                        placeholder="Re-enter password" required minlength="6" autocomplete="new-password" />
                    <button type="button" class="toggle-pw" onclick="togglePw('confirm_password', this)"
                        title="Show/hide password">👁️</button>
                </div>
                <small id="match-hint" class="form-hint"></small>
            </div>

            <!-- Password strength bar -->
            <div class="strength-bar-container" id="strength-bar-container">
                <div class="strength-bar" id="strength-bar"></div>
            </div>
            <small class="form-hint" id="strength-label"></small>

            <button type="submit" class="btn btn-primary btn-block btn-lg mt-3" id="submit-btn">
                🔐 Reset Password
            </button>
        </form>
    </div>
</div>

<style>
    .step-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        margin: 1.2rem 0 0.3rem;
    }

    .step {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--surface, #1e1e2e);
        border: 2px solid var(--border, #444);
        color: var(--text-muted, #888);
        font-size: .85rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .3s, border-color .3s;
    }

    .step.done {
        background: #22c55e;
        border-color: #22c55e;
        color: #fff;
    }

    .step.active {
        background: var(--primary, #7c6af7);
        border-color: var(--primary, #7c6af7);
        color: #fff;
        box-shadow: 0 0 0 4px rgba(124, 106, 247, .25);
    }

    .step-line {
        height: 2px;
        width: 48px;
        background: var(--border, #444);
    }

    .step-line.done {
        background: #22c55e;
    }

    .step-label {
        text-align: center;
        font-size: .8rem;
        color: var(--text-muted, #888);
        margin-bottom: 1rem;
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper .form-control {
        padding-right: 2.8rem;
    }

    .toggle-pw {
        position: absolute;
        right: 0.7rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.1rem;
        padding: 0;
        opacity: .6;
        transition: opacity .2s;
    }

    .toggle-pw:hover {
        opacity: 1;
    }

    .strength-bar-container {
        height: 5px;
        background: var(--border, #333);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 0.5rem;
        display: none;
    }

    .strength-bar {
        height: 100%;
        width: 0;
        border-radius: 10px;
        transition: width .4s, background .4s;
    }

    .form-hint {
        display: block;
        font-size: .75rem;
        color: var(--text-muted, #888);
        margin-top: .25rem;
    }
</style>

{% block scripts %}
<script>
    function togglePw(id, btn) {
        const el = document.getElementById(id);
        const show = el.type === 'password';
        el.type = show ? 'text' : 'password';
        btn.textContent = show ? '🙈' : '👁️';
    }

    const newPw = document.getElementById('new_password');
    const confPw = document.getElementById('confirm_password');
    const hint = document.getElementById('match-hint');
    const bar = document.getElementById('strength-bar');
    const barCnt = document.getElementById('strength-bar-container');
    const label = document.getElementById('strength-label');

    function getStrength(pw) {
        let score = 0;
        if (pw.length >= 6) score++;
        if (pw.length >= 10) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        return score;
    }

    newPw.addEventListener('input', () => {
        const pw = newPw.value;
        if (!pw) { barCnt.style.display = 'none'; label.textContent = ''; return; }
        barCnt.style.display = 'block';
        const s = getStrength(pw);
        const pct = (s / 5) * 100;
        const info = s <= 1 ? ['#ef4444', 'Weak'] : s <= 3 ? ['#f59e0b', 'Fair'] : ['#22c55e', 'Strong'];
        bar.style.width = pct + '%';
        bar.style.background = info[0];
        label.textContent = 'Strength: ' + info[1];
        label.style.color = info[0];
        checkMatch();
    });

    confPw.addEventListener('input', checkMatch);

    function checkMatch() {
        if (!confPw.value) { hint.textContent = ''; return; }
        if (newPw.value === confPw.value) {
            hint.textContent = '✅ Passwords match';
            hint.style.color = '#22c55e';
        } else {
            hint.textContent = '❌ Passwords do not match';
            hint.style.color = '#ef4444';
        }
    }
</script>
{% endblock %}
{% endblock %}
